name: Benchmark V12 Totals Opponent Adjustment

on:
  pull_request:
    paths:
      - "scripts/run_v12_totals_opponent_adjustment.py"
      - ".github/workflows/benchmark-v12-totals-opponent-adjustment.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run totals opponent adjustment benchmark
        run: python scripts/run_v12_totals_opponent_adjustment.py
