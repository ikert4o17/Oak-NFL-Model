name: Benchmark V12 Matchup Interactions

on:
  pull_request:
    paths:
      - "scripts/run_v12_matchup_interactions.py"
      - "oak_nfl/**"
      - ".github/workflows/benchmark-v12-matchup-interactions.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run V12 matchup interaction experiment
        run: python scripts/run_v12_matchup_interactions.py
