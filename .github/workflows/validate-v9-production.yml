name: Validate V9 Production Defaults

on:
  pull_request:
    paths:
      - "oak_nfl/qb_adjustment.py"
      - "tests/test_qb_adjustment.py"
      - ".github/workflows/validate-v9-production.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: pytest tests/test_qb_adjustment.py
