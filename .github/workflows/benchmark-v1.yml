name: Benchmark V1

on:
  pull_request:
    paths:
      - "scripts/run_v1_benchmark.py"
      - "scripts/run_v12_weather_validation.py"
      - "oak_nfl/**"
      - ".github/workflows/benchmark-v1.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run Oak Baseline V1 benchmark
        run: python scripts/run_v1_benchmark.py

      - name: Run V12 weather validation
        run: python scripts/run_v12_weather_validation.py
