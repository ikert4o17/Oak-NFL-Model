name: Deploy Oak Dashboard

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "oak_nfl/**"
      - "data/predictions/**"
      - "data/results/**"
      - "scripts/run_weekly_predictions.py"
      - "scripts/build_dashboard_data.py"
      - "scripts/build_power_ratings.py"
      - "scripts/refresh_results.py"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "23 14 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Oak Production Daily"]
    types: [completed]

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  dispatch-production:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Oak Production Daily
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run oak-production.yml --ref main

  deploy:
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Generate or reuse frozen weekly card
        run: python scripts/run_weekly_predictions.py --auto --refresh-schedule --freeze

      - name: Refresh closing-line results
        run: python scripts/refresh_results.py --refresh-schedule

      - name: Build dashboard data and power ratings
        run: |
          latest=$(ls -t data/predictions/oak_*.csv | head -1)
          python scripts/build_dashboard_data.py "$latest"
          season=$(basename "$latest" | sed -E 's/oak_([0-9]+)_week_([0-9]+)\.csv/\1/')
          week=$(basename "$latest" | sed -E 's/oak_([0-9]+)_week_([0-9]+)\.csv/\2/')
          python scripts/build_power_ratings.py --season "$season" --week "$week"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
