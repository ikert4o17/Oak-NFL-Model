name: Benchmark V12 Integration Phase 1

on:
  pull_request:
    paths:
      - "scripts/run_v12_integration_phase1.py"
      - ".github/workflows/benchmark-v12-integration-phase1.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run V12 totals integration phase 1
        run: python scripts/run_v12_integration_phase1.py
