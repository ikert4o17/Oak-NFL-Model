name: Benchmark V12 Edge Buckets

on:
  pull_request:
    paths:
      - "scripts/run_v12_edge_buckets.py"
      - ".github/workflows/benchmark-v12-edge-buckets.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run locked V12 market disagreement validation
        run: python scripts/run_v12_edge_buckets.py
