name: Benchmark V12 Drive Efficiency
on:
  pull_request:
    paths:
      - 'scripts/run_v12_drive_efficiency.py'
      - '.github/workflows/benchmark-v12-drive-efficiency.yml'
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run V12 drive efficiency experiment
        run: python scripts/run_v12_drive_efficiency.py
