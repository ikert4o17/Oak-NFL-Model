name: Weekly Oak Predictions

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 2"
  pull_request:
    paths:
      - "oak_nfl/production.py"
      - "oak_nfl/totals_v12.py"
      - "oak_nfl/weekly.py"
      - "oak_nfl/data/schedules.py"
      - "scripts/run_weekly_predictions.py"
      - "scripts/build_dashboard_data.py"
      - ".github/workflows/weekly-predictions.yml"

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Generate next weekly card
        run: python scripts/run_weekly_predictions.py --auto --refresh-schedule

      - name: Build dashboard data
        run: |
          latest=$(ls -t data/predictions/oak_*.csv | head -1)
          python scripts/build_dashboard_data.py "$latest"

      - name: Upload weekly card
        uses: actions/upload-artifact@v4
        with:
          name: oak-weekly-predictions
          path: |
            data/predictions/*.csv
            site/data/latest.json
          if-no-files-found: error
