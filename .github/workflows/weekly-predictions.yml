name: Weekly Oak Predictions

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"
  pull_request:
    paths:
      - "oak_nfl/production.py"
      - "oak_nfl/totals_v12.py"
      - "oak_nfl/weekly.py"
      - "oak_nfl/live_qb.py"
      - "oak_nfl/injury_context.py"
      - "oak_nfl/weather_context.py"
      - "oak_nfl/qb.py"
      - "oak_nfl/qb_adjustment.py"
      - "oak_nfl/data/depth_charts.py"
      - "oak_nfl/data/injuries.py"
      - "oak_nfl/data/espn_injuries.py"
      - "oak_nfl/data/weather.py"
      - "oak_nfl/data/schedules.py"
      - "oak_nfl/results.py"
      - "scripts/run_weekly_predictions.py"
      - "scripts/build_dashboard_data.py"
      - "scripts/refresh_results.py"
      - ".github/workflows/weekly-predictions.yml"

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Refresh live context and generate or reuse frozen weekly card
        run: python scripts/run_weekly_predictions.py --auto --refresh-schedule --live-qb --live-injuries --live-weather --freeze

      - name: Refresh closing-line results
        run: python scripts/refresh_results.py --refresh-schedule

      - name: Build dashboard data
        run: |
          latest=$(ls -t data/predictions/oak_*.csv | head -1)
          python scripts/build_dashboard_data.py "$latest"

      - name: Persist frozen card, live context, previews, and results
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions/ data/context/ data/previews/ data/results/ site/data/results.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Oak predictions, live context, and results"
            git push
          fi

      - name: Upload weekly card and live context
        uses: actions/upload-artifact@v4
        with:
          name: oak-weekly-predictions
          path: |
            data/predictions/*.csv
            data/context/*.csv
            data/previews/*.csv
            data/results/oak_results.csv
            site/data/latest.json
            site/data/results.json
          if-no-files-found: error
