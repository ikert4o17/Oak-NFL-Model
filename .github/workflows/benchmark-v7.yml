name: Benchmark V7

on:
  pull_request:
    paths:
      - "scripts/run_v7_benchmark.py"
      - "oak_nfl/**"
      - ".github/workflows/benchmark-v7.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run Oak V7 benchmark
        run: python scripts/run_v7_benchmark.py
